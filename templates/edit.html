<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Pokémon</title>
</head>
<body>

    <h1>Modifica {{ pokemon.name }}</h1>

    <form action="{{ url_for('edit_pokemon', id=pokemon.id) }}" method="POST">

        <label for="height">Altezza:</label>
        <input type="number" id="height" name="height" value="{{ pokemon.height }}" required>
        <br>

        <label for="weight">Peso:</label>
        <input type="number" id="weight" name="weight" value="{{ pokemon.weight }}" required>
        <br>

        <button type="submit">Salva modifiche</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">← Torna alla lista</a>

</body>
</html>
